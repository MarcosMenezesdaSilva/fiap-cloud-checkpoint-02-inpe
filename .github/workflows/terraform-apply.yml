
name: provision-mysql-queimadas

on:
  workflow_dispatch:
    inputs:
      operacao:
        description: "Operacao Terraform"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      confirmacao:
        description: "Para aplicar, digite CRIAR-MYSQL"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-mysql-queimadas
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform MySQL Azure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar confirmacao de Apply
        if: inputs.operacao == 'apply'
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$CONFIRMACAO" != "CRIAR-MYSQL" ]; then
            echo "::error::Confirmacao invalida."
            exit 1
          fi

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      - name: Terraform Apply
        if: inputs.operacao == 'apply'
        run: terraform apply -input=false tfplan

      - name: Exibir resultados
        if: inputs.operacao == 'apply'
        run: |
          terraform output mysql_server_name
          terraform output mysql_fqdn
          terraform output database_name
          terraform output resource_group_name
